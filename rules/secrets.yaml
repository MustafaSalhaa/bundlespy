rules:

# ── AWS ──────────────────────────────────────────────────────────────────────

- id: AWS_ACCESS_KEY
  name: AWS Access Key ID
  category: AWS
  pattern: (?<![A-Z0-9])(AKIA|ABIA|ACCA|AGPA|AIDA|AIPA|ANPA|ANVA|APKA|AROA|ASCA|ASIA)[A-Z0-9]{16}(?![A-Z0-9])
  severity: CRITICAL
  confidence: 0.95
  description: AWS Access Key ID found in JavaScript.
  remediation: Remove from client-side code. Rotate the key in AWS console.
  fp_notes: Example keys often contain EXAMPLE or repeat characters.

- id: AWS_SECRET_KEY
  name: AWS Secret Access Key
  category: AWS
  pattern: (?i)(?:aws|amazon)[_\-\s]*(?:secret|access)[_\-\s]*(?:key|token)[_\-\s]*[=:][_\-\s]*["\x27`]([A-Za-z0-9/+=]{40})["\x27`]
  severity: CRITICAL
  confidence: 0.90
  description: AWS Secret Access Key found in assignment context.
  remediation: Remove immediately. Rotate key in AWS console.
  fp_notes: 40-character base64 strings appear in many contexts.

- id: AWS_SESSION_TOKEN
  name: AWS Session Token
  category: AWS
  pattern: (?i)aws[_\-\s]*session[_\-\s]*token[_\-\s]*[=:][_\-\s]*["\x27`]([A-Za-z0-9/+=]{100,})["\x27`]
  severity: CRITICAL
  confidence: 0.90
  description: AWS temporary session token found.
  remediation: Tokens are short-lived but rotate immediately if found.
  fp_notes: Very long base64 string.

- id: AWS_MFA_SERIAL
  name: AWS MFA Serial
  category: AWS
  pattern: arn:aws:iam::\d{12}:mfa/[A-Za-z0-9+=,.@_/-]+
  severity: MEDIUM
  confidence: 0.85
  description: AWS MFA device ARN found.
  remediation: Review IAM configuration exposure.
  fp_notes: ARN format is distinctive.

- id: AWS_ARN
  name: AWS Resource ARN
  category: AWS
  pattern: arn:aws:[a-z0-9\-]+:[a-z0-9\-]*:\d{12}:[A-Za-z0-9:/_\-]+
  severity: LOW
  confidence: 0.80
  description: AWS Resource ARN found. May expose account ID and resource structure.
  remediation: Review if ARN exposure is intentional.
  fp_notes: ARNs are often used in frontend for legitimate reasons.

- id: AWS_ACCOUNT_ID
  name: AWS Account ID
  category: AWS
  pattern: (?i)(?:account[_\-\s]*id|aws[_\-\s]*account)[_\-\s]*[=:][_\-\s]*["\x27`]?(\d{12})["\x27`]?
  severity: LOW
  confidence: 0.75
  description: AWS Account ID found. Used for ARN construction and account enumeration.
  remediation: Avoid exposing account IDs in client-side code.
  fp_notes: 12-digit numbers appear in other contexts.

# ── Google / Firebase ────────────────────────────────────────────────────────

- id: GOOGLE_API_KEY
  name: Google API Key
  category: Google
  pattern: AIza[0-9A-Za-z\-_]{35}
  severity: HIGH
  confidence: 0.90
  description: Google API Key found.
  remediation: Restrict key to specific APIs and HTTP referrers in Google Cloud Console.
  fp_notes: Maps keys are often intentionally public but should be referrer-restricted.

- id: GOOGLE_OAUTH_CLIENT
  name: Google OAuth Client ID
  category: Google
  pattern: '[0-9]+-[0-9A-Za-z_]{32}\.apps\.googleusercontent\.com'
  severity: MEDIUM
  confidence: 0.85
  description: Google OAuth Client ID found.
  remediation: Verify the client is restricted to authorized redirect URIs.
  fp_notes: OAuth client IDs are frequently embedded in frontend code by design.

- id: GOOGLE_OAUTH_SECRET
  name: Google OAuth Client Secret
  category: Google
  pattern: (?i)client[_\-\s]*secret[_\-\s]*[=:][_\-\s]*["\x27`](GOCSPX-[A-Za-z0-9_\-]{28})["\x27`]
  severity: CRITICAL
  confidence: 0.95
  description: Google OAuth client secret found.
  remediation: Rotate immediately in Google Cloud Console.
  fp_notes: GOCSPX prefix is very distinctive.

- id: FIREBASE_API_KEY
  name: Firebase API Key
  category: Google
  pattern: (?i)firebase[_\-\s]*(?:api)?[_\-\s]*key[_\-\s]*[=:][_\-\s]*["\x27`]([A-Za-z0-9\-_]{39})["\x27`]
  severity: HIGH
  confidence: 0.85
  description: Firebase API key found.
  remediation: Review Firebase security rules.
  fp_notes: Firebase keys are often intentionally embedded. Risk is in security rules.

- id: FIREBASE_CONFIG
  name: Firebase Project Config
  category: Google
  pattern: (?i)projectId["\x27]?\s*:\s*["\x27]([a-z0-9\-]+)["\x27].*?storageBucket
  severity: MEDIUM
  confidence: 0.82
  description: Firebase project configuration block found.
  remediation: Review Firebase security rules and API key restrictions.
  fp_notes: Firebase configs are intentionally embedded but need proper rules.

- id: GOOGLE_SERVICE_ACCOUNT
  name: Google Service Account Email
  category: Google
  pattern: '[a-z0-9\-]+@[a-z0-9\-]+\.iam\.gserviceaccount\.com'
  severity: MEDIUM
  confidence: 0.90
  description: Google service account email found.
  remediation: Review service account permissions and key rotation.
  fp_notes: Service account emails identify privileged identities.

- id: GOOGLE_PRIVATE_KEY_ID
  name: Google Private Key ID
  category: Google
  pattern: (?i)private[_\-\s]*key[_\-\s]*id["\x27]?\s*:\s*["\x27]([a-f0-9]{40})["\x27]
  severity: HIGH
  confidence: 0.90
  description: Google service account private key ID found.
  remediation: Rotate the service account key immediately.
  fp_notes: Part of service account JSON credential file.

- id: GCP_PROJECT_ID
  name: Google Cloud Project ID
  category: Google
  pattern: (?i)(?:gcp|google[_\-\s]*cloud)[_\-\s]*project[_\-\s]*(?:id)?[_\-\s]*[=:][_\-\s]*["\x27`]([a-z][a-z0-9\-]{4,28}[a-z0-9])["\x27`]
  severity: LOW
  confidence: 0.75
  description: Google Cloud Project ID found.
  remediation: Project IDs alone are low risk but can aid enumeration.
  fp_notes: Project IDs are often public.

# ── Azure ────────────────────────────────────────────────────────────────────

- id: AZURE_CONNECTION_STRING
  name: Azure Storage Connection String
  category: Azure
  pattern: DefaultEndpointsProtocol=https?;AccountName=[^;]+;AccountKey=[A-Za-z0-9+/=]{88};
  severity: CRITICAL
  confidence: 0.97
  description: Azure Storage connection string found. Provides full access to the storage account.
  remediation: Remove from client-side code. Use SAS tokens with minimal permissions.
  fp_notes: Very low false positive rate due to specific format.

- id: AZURE_SAS_TOKEN
  name: Azure SAS Token
  category: Azure
  pattern: (?i)sv=\d{4}-\d{2}-\d{2}&(?:ss|spr|sr|st|se|sp|sip|sig)=
  severity: HIGH
  confidence: 0.88
  description: Azure SAS token found.
  remediation: Review permissions and expiry. Regenerate if unexpired and overly permissive.
  fp_notes: SAS tokens may be intentionally short-lived.

- id: AZURE_CLIENT_SECRET
  name: Azure Client Secret
  category: Azure
  pattern: (?i)(?:azure|aad|ad)[_\-\s]*client[_\-\s]*secret[_\-\s]*[=:][_\-\s]*["\x27`]([A-Za-z0-9~._\-]{34,40})["\x27`]
  severity: CRITICAL
  confidence: 0.88
  description: Azure AD application client secret found.
  remediation: Rotate in Azure Active Directory app registrations.
  fp_notes: Must appear with azure/aad context.

- id: AZURE_TENANT_ID
  name: Azure Tenant ID
  category: Azure
  pattern: (?i)(?:tenant[_\-\s]*id|azure[_\-\s]*tenant)[_\-\s]*[=:][_\-\s]*["\x27`]([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})["\x27`]
  severity: LOW
  confidence: 0.80
  description: Azure Tenant ID found.
  remediation: Tenant IDs alone are low risk but confirm Azure usage.
  fp_notes: UUID format is common in many contexts.

- id: AZURE_SUBSCRIPTION_ID
  name: Azure Subscription ID
  category: Azure
  pattern: (?i)(?:subscription[_\-\s]*id)[_\-\s]*[=:][_\-\s]*["\x27`]([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})["\x27`]
  severity: LOW
  confidence: 0.78
  description: Azure Subscription ID found.
  remediation: Subscription IDs can aid enumeration.
  fp_notes: UUID format appears in many contexts.

- id: AZURE_BLOB_URL
  name: Azure Blob Storage URL
  category: Azure
  pattern: https://[a-z0-9]+\.blob\.core\.windows\.net/[^\s"'\x27<>]+
  severity: MEDIUM
  confidence: 0.88
  description: Azure Blob Storage URL found.
  remediation: Verify container access level.
  fp_notes: Public blob URLs are common for CDN assets.

- id: AZURE_DEVOPS_TOKEN
  name: Azure DevOps Personal Access Token
  category: Azure
  pattern: (?i)(?:azure|devops|ado)[_\-\s]*(?:pat|token|access)[_\-\s]*[=:][_\-\s]*["\x27`]([A-Za-z0-9]{52})["\x27`]
  severity: CRITICAL
  confidence: 0.85
  description: Azure DevOps PAT found.
  remediation: Revoke immediately in Azure DevOps user settings.
  fp_notes: Must have azure/devops/ado context.

# ── GitHub / GitLab / Bitbucket ──────────────────────────────────────────────

- id: GITHUB_TOKEN
  name: GitHub Personal Access Token
  category: GitHub
  pattern: (?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}
  severity: CRITICAL
  confidence: 0.95
  description: GitHub Personal Access Token found.
  remediation: Revoke immediately at github.com/settings/tokens.
  fp_notes: Very distinctive prefix format makes false positives rare.

- id: GITHUB_FINE_GRAINED
  name: GitHub Fine-Grained Token
  category: GitHub
  pattern: github_pat_[A-Za-z0-9_]{82}
  severity: CRITICAL
  confidence: 0.97
  description: GitHub fine-grained personal access token found.
  remediation: Revoke immediately at github.com/settings/tokens.
  fp_notes: Extremely distinctive format.

- id: GITHUB_APP_TOKEN
  name: GitHub App Token
  category: GitHub
  pattern: (?:ghs|v1\.)[A-Za-z0-9]{36}
  severity: CRITICAL
  confidence: 0.88
  description: GitHub App installation token found.
  remediation: Rotate the GitHub App credentials.
  fp_notes: Short-lived but still sensitive.

- id: GITLAB_TOKEN
  name: GitLab Personal Access Token
  category: GitLab
  pattern: glpat-[A-Za-z0-9\-_]{20}
  severity: CRITICAL
  confidence: 0.95
  description: GitLab Personal Access Token found.
  remediation: Revoke immediately in GitLab user settings.
  fp_notes: Distinctive prefix makes false positives rare.

- id: GITLAB_RUNNER_TOKEN
  name: GitLab Runner Registration Token
  category: GitLab
  pattern: GR1326[a-zA-Z0-9_\-]{16,}
  severity: HIGH
  confidence: 0.88
  description: GitLab Runner registration token found.
  remediation: Reset runner token in GitLab CI/CD settings.
  fp_notes: Must start with GR1326 prefix which is the real GitLab runner token format.

- id: GITLAB_DEPLOY_TOKEN
  name: GitLab Deploy Token
  category: GitLab
  pattern: gldt-[A-Za-z0-9\-_]{20}
  severity: HIGH
  confidence: 0.90
  description: GitLab deploy token found.
  remediation: Revoke in GitLab repository settings.
  fp_notes: Distinctive gldt prefix.

- id: BITBUCKET_CLIENT_ID
  name: Bitbucket OAuth Client ID
  category: Bitbucket
  pattern: (?i)bitbucket[_\-\s]*(?:client|consumer)[_\-\s]*(?:id|key)[_\-\s]*[=:][_\-\s]*["\x27`]([A-Za-z0-9]{32})["\x27`]
  severity: MEDIUM
  confidence: 0.82
  description: Bitbucket OAuth client ID found.
  remediation: Review OAuth app permissions.
  fp_notes: Must have bitbucket context.

- id: BITBUCKET_CLIENT_SECRET
  name: Bitbucket OAuth Client Secret
  category: Bitbucket
  pattern: (?i)bitbucket[_\-\s]*(?:client|consumer)[_\-\s]*secret[_\-\s]*[=:][_\-\s]*["\x27`]([A-Za-z0-9]{32})["\x27`]
  severity: CRITICAL
  confidence: 0.88
  description: Bitbucket OAuth client secret found.
  remediation: Rotate in Bitbucket OAuth settings.
  fp_notes: Must have bitbucket context.

# ── Stripe ───────────────────────────────────────────────────────────────────

- id: STRIPE_SECRET_KEY
  name: Stripe Secret Key
  category: Stripe
  pattern: sk_live_[0-9a-zA-Z]{24,}
  severity: CRITICAL
  confidence: 0.98
  description: Stripe live secret key found. Full access to Stripe account.
  remediation: Revoke immediately at dashboard.stripe.com/apikeys.
  fp_notes: The sk_live_ prefix is extremely distinctive.

- id: STRIPE_PUBLISHABLE_KEY
  name: Stripe Publishable Key
  category: Stripe
  pattern: pk_live_[0-9a-zA-Z]{24,}
  severity: INFO
  confidence: 0.95
  description: Stripe publishable key found. Intentionally public but confirms Stripe usage.
  remediation: No action required. Publishable keys are designed for frontend use.
  fp_notes: Intentionally public.

- id: STRIPE_TEST_SECRET
  name: Stripe Test Secret Key
  category: Stripe
  pattern: sk_test_[0-9a-zA-Z]{24,}
  severity: MEDIUM
  confidence: 0.90
  description: Stripe test mode secret key found.
  remediation: Remove test keys from production code.
  fp_notes: Test keys cannot be used for real charges.

- id: STRIPE_TEST_PUBLISHABLE
  name: Stripe Test Publishable Key
  category: Stripe
  pattern: pk_test_[0-9a-zA-Z]{24,}
  severity: LOW
  confidence: 0.90
  description: Stripe test publishable key found. Indicates test mode usage.
  remediation: Ensure production uses live keys with proper restrictions.
  fp_notes: Test publishable keys are harmless but indicate test/dev exposure.

- id: STRIPE_RESTRICTED_KEY
  name: Stripe Restricted Key
  category: Stripe
  pattern: rk_live_[0-9a-zA-Z]{24,}
  severity: HIGH
  confidence: 0.95
  description: Stripe restricted live key found.
  remediation: Revoke and review what permissions the key has.
  fp_notes: Restricted keys have limited scope but are still sensitive.

- id: STRIPE_WEBHOOK_SECRET
  name: Stripe Webhook Secret
  category: Stripe
  pattern: whsec_[A-Za-z0-9]{32,}
  severity: HIGH
  confidence: 0.95
  description: Stripe webhook signing secret found.
  remediation: Rotate in Stripe dashboard webhook settings.
  fp_notes: Used to verify webhook authenticity.

# ── PayPal ───────────────────────────────────────────────────────────────────

- id: PAYPAL_CLIENT_ID
  name: PayPal Client ID
  category: PayPal
  pattern: (?i)paypal[_\-\s]*client[_\-\s]*id[_\-\s]*[=:][_\-\s]*["\x27`]([A-Za-z0-9\-_]{80,})["\x27`]
  severity: MEDIUM
  confidence: 0.82
  description: PayPal client ID found.
  remediation: Restrict to specific domains in PayPal developer dashboard.
  fp_notes: Client IDs are often intentionally public.

- id: PAYPAL_CLIENT_SECRET
  name: PayPal Client Secret
  category: PayPal
  pattern: (?i)paypal[_\-\s]*(?:client[_\-\s]*)?secret[_\-\s]*[=:][_\-\s]*["\x27`]([A-Za-z0-9\-_]{80,})["\x27`]
  severity: CRITICAL
  confidence: 0.88
  description: PayPal client secret found.
  remediation: Rotate immediately in PayPal developer dashboard.
  fp_notes: Must have paypal context.

# ── Slack ────────────────────────────────────────────────────────────────────

- id: SLACK_TOKEN
  name: Slack API Token
  category: Slack
  pattern: xox[baprs]-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24,34}
  severity: HIGH
  confidence: 0.93
  description: Slack API token found.
  remediation: Revoke the token in Slack app settings.
  fp_notes: Distinctive format, low false positive rate.

- id: SLACK_WEBHOOK
  name: Slack Webhook URL
  category: Slack
  pattern: https://hooks\.slack\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+
  severity: MEDIUM
  confidence: 0.95
  description: Slack incoming webhook URL found.
  remediation: Revoke the webhook in Slack. Webhooks should not be in client-side code.
  fp_notes: Very distinctive URL pattern.

- id: SLACK_APP_TOKEN
  name: Slack App-Level Token
  category: Slack
  pattern: xapp-[0-9]-[A-Z0-9]{10,}-[0-9]+-[a-f0-9]{64}
  severity: CRITICAL
  confidence: 0.95
  description: Slack app-level token found.
  remediation: Rotate in Slack app settings.
  fp_notes: Distinctive xapp prefix.

- id: SLACK_BOT_TOKEN
  name: Slack Bot Token
  category: Slack
  pattern: xoxb-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24}
  severity: HIGH
  confidence: 0.93
  description: Slack bot token found.
  remediation: Revoke and rotate in Slack app settings.
  fp_notes: xoxb prefix is distinctive.

# ── Email services ───────────────────────────────────────────────────────────

- id: SENDGRID_API_KEY
  name: SendGrid API Key
  category: Email
  pattern: SG\.[A-Za-z0-9\-_]{22}\.[A-Za-z0-9\-_]{43}
  severity: HIGH
  confidence: 0.97
  description: SendGrid API key found.
  remediation: Revoke in SendGrid settings. Use server-side email sending.
  fp_notes: Very distinctive three-part format.

- id: MAILGUN_API_KEY
  name: Mailgun API Key
  category: Email
  pattern: (?i)(?:mailgun)[_\-\s]*(?:api[_\-\s]*)?key[_\-\s]*[=:][_\-\s]*["\x27`](key-[A-Za-z0-9]{32})["\x27`]
  severity: HIGH
  confidence: 0.90
  description: Mailgun API key found.
  remediation: Rotate in Mailgun account settings.
  fp_notes: key- prefix is distinctive.

- id: MAILCHIMP_API_KEY
  name: Mailchimp API Key
  category: Email
  pattern: '[A-Za-z0-9]{32}-us[0-9]{1,2}'
  severity: HIGH
  confidence: 0.85
  description: Mailchimp API key found.
  remediation: Rotate in Mailchimp account settings.
  fp_notes: The -us[N] datacenter suffix is distinctive.

- id: POSTMARK_API_KEY
  name: Postmark API Key
  category: Email
  pattern: (?i)postmark[_\-\s]*(?:api[_\-\s]*)?(?:key|token)[_\-\s]*[=:][_\-\s]*["\x27`]([A-Za-z0-9\-]{36})["\x27`]
  severity: HIGH
  confidence: 0.85
  description: Postmark API key found.
  remediation: Rotate in Postmark account settings.
  fp_notes: Must have postmark context.

- id: EMAILJS_KEY
  name: EmailJS Public Key
  category: Email
  pattern: emailjs\.init\s*\(\s*["\x27`]([A-Za-z0-9_\-]{10,})["\x27`]\s*\)
  severity: MEDIUM
  confidence: 0.90
  description: EmailJS public key found. Can be abused to send emails via your account.
  remediation: Add rate limiting and domain restrictions in EmailJS dashboard.
  fp_notes: EmailJS keys are client-side by design but should be domain-restricted.

- id: SMTP_CREDENTIALS
  name: SMTP Credentials in URL
  category: Email
  pattern: smtps?://[A-Za-z0-9._%+\-]+:[A-Za-z0-9!@#$%^&*()_+\-=]{4,}@[A-Za-z0-9.\-]+
  severity: CRITICAL
  confidence: 0.92
  description: SMTP credentials found in connection string.
  remediation: Remove immediately. Rotate email account credentials.
  fp_notes: Low false positive due to smtp:// scheme.

- id: RESEND_API_KEY
  name: Resend API Key
  category: Email
  pattern: re_[A-Za-z0-9]{32,}
  severity: HIGH
  confidence: 0.85
  description: Resend email API key found.
  remediation: Rotate in Resend dashboard.
  fp_notes: re_ prefix with long alphanumeric string.

# ── Twilio ───────────────────────────────────────────────────────────────────

- id: TWILIO_ACCOUNT_SID
  name: Twilio Account SID
  category: Twilio
  pattern: AC[a-z0-9]{32}
  severity: MEDIUM
  confidence: 0.80
  description: Potential Twilio Account SID found.
  remediation: Verify context. Use server-side Twilio integration.
  fp_notes: 34-character hex strings appear in other contexts.

- id: TWILIO_AUTH_TOKEN
  name: Twilio Auth Token
  category: Twilio
  pattern: (?i)twilio[_\-\s]*auth[_\-\s]*token[_\-\s]*[=:][_\-\s]*["\x27`]([a-f0-9]{32})["\x27`]
  severity: CRITICAL
  confidence: 0.90
  description: Twilio auth token found.
  remediation: Rotate in Twilio console.
  fp_notes: Must have twilio context.

- id: TWILIO_API_KEY
  name: Twilio API Key
  category: Twilio
  pattern: SK[a-z0-9]{32}
  severity: HIGH
  confidence: 0.82
  description: Twilio API key found.
  remediation: Revoke in Twilio API Keys console.
  fp_notes: SK prefix with 32 hex chars.

# ── Messaging / Chat ─────────────────────────────────────────────────────────

- id: DISCORD_TOKEN
  name: Discord Bot Token
  category: Discord
  pattern: '[MN][A-Za-z0-9]{23}\.[\w-]{6}\.[\w-]{27}'
  severity: HIGH
  confidence: 0.82
  description: Potential Discord bot token found.
  remediation: Regenerate token in Discord developer portal.
  fp_notes: Pattern can match other base64-like strings.

- id: DISCORD_WEBHOOK
  name: Discord Webhook URL
  category: Discord
  pattern: https://discord(?:app)?\.com/api/webhooks/[0-9]+/[A-Za-z0-9_\-]+
  severity: MEDIUM
  confidence: 0.95
  description: Discord webhook URL found.
  remediation: Delete the webhook in Discord server settings.
  fp_notes: Very distinctive URL pattern.

- id: DISCORD_CLIENT_SECRET
  name: Discord OAuth Client Secret
  category: Discord
  pattern: (?i)discord[_\-\s]*client[_\-\s]*secret[_\-\s]*[=:][_\-\s]*["\x27`]([A-Za-z0-9_\-]{32})["\x27`]
  severity: CRITICAL
  confidence: 0.88
  description: Discord OAuth client secret found.
  remediation: Rotate in Discord Developer Portal.
  fp_notes: Must have discord context.

- id: TELEGRAM_BOT_TOKEN
  name: Telegram Bot Token
  category: Telegram
  pattern: '[0-9]{8,10}:[A-Za-z0-9_\-]{35}'
  severity: HIGH
  confidence: 0.85
  description: Telegram bot token found.
  remediation: Revoke via @BotFather and generate new token.
  fp_notes: Numeric ID followed by colon and token.

- id: TELEGRAM_API_HASH
  name: Telegram API Hash
  category: Telegram
  pattern: (?i)telegram[_\-\s]*(?:api[_\-\s]*)?hash[_\-\s]*[=:][_\-\s]*["\x27`]([a-f0-9]{32})["\x27`]
  severity: HIGH
  confidence: 0.85
  description: Telegram API hash found.
  remediation: Revoke in Telegram API settings.
  fp_notes: Must have telegram context.

- id: PUSHER_APP_KEY
  name: Pusher App Key
  category: Pusher
  pattern: (?i)pusher[_\-\s]*(?:app[_\-\s]*)?key[_\-\s]*[=:][_\-\s]*["\x27`]([a-z0-9]{20})["\x27`]
  severity: MEDIUM
  confidence: 0.82
  description: Pusher app key found.
  remediation: Keys are client-side but rotate if abused.
  fp_notes: Must have pusher context.

- id: PUSHER_APP_SECRET
  name: Pusher App Secret
  category: Pusher
  pattern: (?i)pusher[_\-\s]*(?:app[_\-\s]*)?secret[_\-\s]*[=:][_\-\s]*["\x27`]([a-z0-9]{20})["\x27`]
  severity: CRITICAL
  confidence: 0.88
  description: Pusher app secret found.
  remediation: Rotate in Pusher dashboard immediately.
  fp_notes: Must have pusher context.

- id: INTERCOM_ACCESS_TOKEN
  name: Intercom Access Token
  category: Intercom
  pattern: (?i)intercom[_\-\s]*(?:access[_\-\s]*)?token[_\-\s]*[=:][_\-\s]*["\x27`]([A-Za-z0-9_\-]{60,})["\x27`]
  severity: HIGH
