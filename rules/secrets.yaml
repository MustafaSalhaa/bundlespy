# ── Obfuscation / Encoding detection ─────────────────────────────────────────

- id: URL_ENCODED_CREDS
  name: URL-Encoded Credentials
  category: Generic
  pattern: (?i)(?:key|secret|token|password|auth)[_\-\s]*[=:][_\-\s]*["\x27\x60]?(%[0-9A-Fa-f]{2}[A-Za-z0-9%+_\-./=]{10,})["\x27\x60]?
  severity: HIGH
  confidence: 0.72
  description: URL-encoded string in credential context. May be obfuscated secret.
  remediation: Decode and review the value. Remove from client-side code.
  fp_notes: URL encoding is sometimes used to hide secrets in plain sight.

- id: CONCAT_SECRET_HINT
  name: String Concatenation Secret Pattern
  category: Generic
  pattern: (?i)(?:key|secret|token|auth)[_\-\s]*[=:]\s*["\x27\x60][A-Za-z0-9+/=_\-]{8,}["\x27\x60]\s*\+\s*["\x27\x60][A-Za-z0-9+/=_\-]{4,}["\x27\x60]
  severity: MEDIUM
  confidence: 0.60
  description: Secret value appears split across string concatenation. Obfuscation technique.
  remediation: Review concatenated value in full. Move to server-side secrets management.
  fp_notes: High false positive rate. String building is common in non-secret contexts too.

- id: TEMPLATE_LITERAL_SECRET
  name: Template Literal Secret
  category: Generic
  pattern: (?i)(?:key|secret|token|authorization)\s*[=:]\s*`(?:[^`$]{0,40})\$\{[^}]{3,40}\}(?:[^`$]{0,40})`
  severity: MEDIUM
  confidence: 0.58
  description: Template literal used in credential context. May dynamically assemble a secret.
  remediation: Review the assembled value at runtime via network interception.
  fp_notes: High false positive rate. Template literals are common everywhere.

