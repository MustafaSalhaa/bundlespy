rules:
- id: AWS_ACCESS_KEY
  name: AWS Access Key ID
  category: AWS
  pattern: (?<![A-Z0-9])(AKIA|ABIA|ACCA|AGPA|AIDA|AIPA|AKIA|ANPA|ANVA|APKA|AROA|ASCA|ASIA)[A-Z0-9]{16}(?![A-Z0-9])
  severity: CRITICAL
  confidence: 0.95
  description: Potential AWS Access Key ID found in JavaScript.
  remediation: Remove from client-side code. Rotate the key in the AWS console.
  fp_notes: Example keys often contain EXAMPLE or repeat characters.
- id: AWS_SECRET_KEY
  name: AWS Secret Access Key
  category: AWS
  pattern: (?i)(?:aws|amazon)[_\-\s]*(?:secret|access)[_\-\s]*(?:key|token)[_\-\s]*[=:][_\-\s]*[\"'`]([A-Za-z0-9/+=]{40})[\"'`]
  severity: CRITICAL
  confidence: 0.9
  description: Potential AWS Secret Access Key found in assignment context.
  remediation: Remove immediately. Rotate key in AWS console.
  fp_notes: 40-character base64 strings appear in many contexts. Confirm variable
    name.
- id: GOOGLE_API_KEY
  name: Google API Key
  category: Google
  pattern: AIza[0-9A-Za-z\-_]{35}
  severity: HIGH
  confidence: 0.9
  description: Potential Google API Key found.
  remediation: Restrict key to specific APIs and HTTP referrers in Google Cloud Console.
  fp_notes: Google Maps keys are often intentionally public but should be referrer-restricted.
- id: GOOGLE_OAUTH_CLIENT
  name: Google OAuth Client ID
  category: Google
  pattern: '[0-9]+-[0-9A-Za-z_]{32}\.apps\.googleusercontent\.com'
  severity: MEDIUM
  confidence: 0.85
  description: Google OAuth Client ID found. Often intentionally public.
  remediation: Verify the client is restricted to authorized redirect URIs.
  fp_notes: OAuth client IDs are frequently embedded in frontend code by design.
- id: FIREBASE_API_KEY
  name: Firebase API Key
  category: Google
  pattern: (?i)firebase[_\-\s]*(?:api)?[_\-\s]*key[_\-\s]*[=:][_\-\s]*[\"'`]([A-Za-z0-9\-_]{39})[\"'`]
  severity: HIGH
  confidence: 0.85
  description: Firebase API key found. Misconfigured Firebase rules can expose database
    contents.
  remediation: Review Firebase security rules.
  fp_notes: Firebase keys are often intentionally embedded. Risk is in security rules.
- id: AZURE_CONNECTION_STRING
  name: Azure Connection String
  category: Azure
  pattern: DefaultEndpointsProtocol=https?;AccountName=[^;]+;AccountKey=[A-Za-z0-9+/=]{88};
  severity: CRITICAL
  confidence: 0.97
  description: Azure Storage connection string found. Provides full access to the
    storage account.
  remediation: Remove from client-side code. Use SAS tokens with minimal permissions.
  fp_notes: Very low false positive rate due to specific format.
- id: AZURE_SAS_TOKEN
  name: Azure SAS Token
  category: Azure
  pattern: (?i)sv=\d{4}-\d{2}-\d{2}&(?:ss|spr|sr|st|se|sp|sip|sig)=
  severity: HIGH
  confidence: 0.88
  description: Azure SAS token found. Provides temporary but potentially broad access.
  remediation: Review permissions and expiry. Regenerate if unexpired and overly permissive.
  fp_notes: SAS tokens may be intentionally short-lived. Check expiry and permissions.
- id: GITHUB_TOKEN
  name: GitHub Personal Access Token
  category: GitHub
  pattern: (?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}
  severity: CRITICAL
  confidence: 0.95
  description: GitHub Personal Access Token found.
  remediation: Revoke immediately at github.com/settings/tokens.
  fp_notes: Very distinctive prefix format makes false positives rare.
- id: GITHUB_FINE_GRAINED
  name: GitHub Fine-Grained Token
  category: GitHub
  pattern: github_pat_[A-Za-z0-9_]{82}
  severity: CRITICAL
  confidence: 0.97
  description: GitHub fine-grained personal access token found.
  remediation: Revoke immediately at github.com/settings/tokens.
  fp_notes: Extremely distinctive format.
- id: GITLAB_TOKEN
  name: GitLab Personal Access Token
  category: GitLab
  pattern: glpat-[A-Za-z0-9\-_]{20}
  severity: CRITICAL
  confidence: 0.95
  description: GitLab Personal Access Token found.
  remediation: Revoke immediately in GitLab user settings.
  fp_notes: Distinctive prefix makes false positives rare.
- id: STRIPE_SECRET_KEY
  name: Stripe Secret Key
  category: Stripe
  pattern: sk_live_[0-9a-zA-Z]{24}
  severity: CRITICAL
  confidence: 0.98
  description: Stripe live secret key found. Full access to Stripe account.
  remediation: Revoke immediately at dashboard.stripe.com/apikeys.
  fp_notes: The sk_live_ prefix is extremely distinctive.
- id: STRIPE_PUBLISHABLE_KEY
  name: Stripe Publishable Key
  category: Stripe
  pattern: pk_live_[0-9a-zA-Z]{24}
  severity: INFO
  confidence: 0.95
  description: Stripe publishable key found. Intentionally public but confirms Stripe
    usage.
  remediation: No action required. Publishable keys are designed for frontend use.
  fp_notes: Intentionally public.
- id: STRIPE_TEST_KEY
  name: Stripe Test Secret Key
  category: Stripe
  pattern: sk_test_[0-9a-zA-Z]{24}
  severity: MEDIUM
  confidence: 0.9
  description: Stripe test mode secret key found.
  remediation: Remove test keys from production code.
  fp_notes: Test keys cannot be used for real charges but indicates poor secret management.
- id: SLACK_TOKEN
  name: Slack API Token
  category: Slack
  pattern: xox[baprs]-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24,34}
  severity: HIGH
  confidence: 0.93
  description: Slack API token found.
  remediation: Revoke the token in Slack app settings.
  fp_notes: Distinctive format, low false positive rate.
- id: SLACK_WEBHOOK
  name: Slack Webhook URL
  category: Slack
  pattern: https://hooks\.slack\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+
  severity: MEDIUM
  confidence: 0.95
  description: Slack incoming webhook URL found.
  remediation: Revoke the webhook in Slack. Webhooks should not be in client-side
    code.
  fp_notes: Very distinctive URL pattern.
- id: SENDGRID_API_KEY
  name: SendGrid API Key
  category: Email
  pattern: SG\.[A-Za-z0-9\-_]{22}\.[A-Za-z0-9\-_]{43}
  severity: HIGH
  confidence: 0.97
  description: SendGrid API key found.
  remediation: Revoke in SendGrid settings. Use server-side email sending.
  fp_notes: Very distinctive three-part format.
- id: JWT_TOKEN
  name: JSON Web Token
  category: JWT
  pattern: eyJ[A-Za-z0-9\-_=]+\.eyJ[A-Za-z0-9\-_=]+\.[A-Za-z0-9\-_.+/=]*
  severity: HIGH
  confidence: 0.85
  description: JSON Web Token found in JavaScript.
  remediation: Review token algorithm and expiry. Never hardcode tokens client-side.
  fp_notes: Some JWTs are intentionally embedded as examples. Check expiry.
- id: GENERIC_API_KEY
  name: Generic API Key Assignment
  category: Generic
  pattern: (?i)(?:api[_\-]?key|apikey|api[_\-]?token|access[_\-]?key|secret[_\-]?key|auth[_\-]?key)[_\-\s]*[=:][_\-\s]*[\"'`]([A-Za-z0-9\-_./+=]{20,80})[\"'`]
  severity: MEDIUM
  confidence: 0.65
  description: Generic API key or token assignment found.
  remediation: Review the value and move credentials to environment variables.
  fp_notes: High false positive rate. Review context and value entropy manually.
- id: GENERIC_PASSWORD
  name: Generic Password Assignment
  category: Generic
  pattern: (?i)(?:password|passwd|pwd|pass|secret)[_\-\s]*[=:][_\-\s]*[\"'`]([^\"'`\s]{8,})[\"'`]
  severity: HIGH
  confidence: 0.6
  description: Generic password assignment found.
  remediation: Remove hardcoded passwords from client-side code.
  fp_notes: High false positive rate. Placeholder values like password123 are common.
- id: RSA_PRIVATE_KEY
  name: RSA Private Key
  category: Cryptographic
  pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'
  severity: CRITICAL
  confidence: 0.99
  description: Private key header found.
  remediation: Remove immediately. Rotate the key pair.
  fp_notes: Essentially no false positives. The PEM header is unambiguous.
- id: POSTGRES_URL
  name: PostgreSQL Connection String
  category: Database
  pattern: postgres(?:ql)?://[^:\s]+:[^@\s]+@[^\s/]+
  severity: CRITICAL
  confidence: 0.95
  description: PostgreSQL connection string with credentials found.
  remediation: Remove immediately. Rotate database credentials.
  fp_notes: Low false positive rate due to specific URI format.
- id: MYSQL_URL
  name: MySQL Connection String
  category: Database
  pattern: mysql://[^:\s]+:[^@\s]+@[^\s/]+
  severity: CRITICAL
  confidence: 0.95
  description: MySQL connection string with credentials found.
  remediation: Remove immediately.
  fp_notes: Low false positive rate.
- id: MONGODB_URL
  name: MongoDB Connection String
  category: Database
  pattern: mongodb(?:\+srv)?://[^:\s]+:[^@\s]+@[^\s/]+
  severity: CRITICAL
  confidence: 0.95
  description: MongoDB connection string with credentials found.
  remediation: Remove immediately. Rotate credentials.
  fp_notes: Low false positive rate.
- id: REDIS_URL
  name: Redis URL with Credentials
  category: Database
  pattern: redis://:[^@\s]+@[^\s/]+
  severity: HIGH
  confidence: 0.9
  description: Redis URL with password found.
  remediation: Remove from client-side code.
  fp_notes: Low false positive rate when password is present.
- id: S3_BUCKET_URL
  name: AWS S3 Bucket URL
  category: Cloud Storage
  pattern: (?:https?://)?(?:[a-z0-9\-]+\.)?s3(?:\.[a-z0-9\-]+)?\.amazonaws\.com/[^\s\"'<>]+
  severity: MEDIUM
  confidence: 0.88
  description: AWS S3 bucket URL found. May expose bucket names or publicly accessible
    storage.
  remediation: Verify bucket permissions. Ensure bucket is not publicly writable.
  fp_notes: S3 URLs are common and often intentional. Check bucket access.
- id: AZURE_BLOB_URL
  name: Azure Blob Storage URL
  category: Cloud Storage
  pattern: https://[a-z0-9]+\.blob\.core\.windows\.net/[^\s\"'<>]+
  severity: MEDIUM
  confidence: 0.88
  description: Azure Blob Storage URL found.
  remediation: Verify container access level.
  fp_notes: Public blob URLs are common for CDN assets.
- id: GCS_BUCKET_URL
  name: Google Cloud Storage URL
  category: Cloud Storage
  pattern: (?:https?://)?storage\.googleapis\.com/[a-z0-9\-_]+/
  severity: MEDIUM
  confidence: 0.85
  description: Google Cloud Storage bucket URL found.
  remediation: Verify bucket IAM permissions.
  fp_notes: Often used for public assets.
- id: INTERNAL_IP
  name: Private IP Address
  category: Infrastructure
  pattern: (?:https?://)?(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})(?::\d+)?(?:/[^\s\"'<>]*)?
  severity: HIGH
  confidence: 0.8
  description: Private IP address found in JavaScript. May expose internal network
    architecture.
  remediation: Remove internal IP references from client-side code.
  fp_notes: Some private IPs appear in documentation. Check context.
- id: INTERNAL_HOSTNAME
  name: Internal Hostname
  category: Infrastructure
  pattern: (?:https?://)?[a-z0-9\-]+\.(?:local|internal|corp|lan|intranet|int)(?::\d+)?(?:/[^\s\"'<>]*)?
  severity: HIGH
  confidence: 0.78
  description: Internal hostname found. May expose internal network topology.
  remediation: Replace internal hostnames with public-facing endpoints.
  fp_notes: Development hostnames may appear in dev builds.
- id: NPM_TOKEN
  name: NPM Access Token
  category: Package Registry
  pattern: (?:npm_)[A-Za-z0-9\-_]{36}
  severity: HIGH
  confidence: 0.9
  description: NPM access token found.
  remediation: Revoke at npmjs.com. Never embed registry tokens in application code.
  fp_notes: Distinctive prefix pattern.
- id: SHOPIFY_TOKEN
  name: Shopify Private App Token
  category: E-Commerce
  pattern: shppa_[A-Za-z0-9]{32}|shpat_[A-Za-z0-9]{32}
  severity: CRITICAL
  confidence: 0.97
  description: Shopify private app access token found.
  remediation: Revoke immediately in Shopify admin.
  fp_notes: Extremely distinctive prefix format.
- id: BASIC_AUTH_URL
  name: Credentials in URL
  category: Generic
  pattern: https?://[^:\s@]+:[^@\s]+@[^\s\"'<>]+
  severity: HIGH
  confidence: 0.75
  description: URL with embedded credentials found.
  remediation: Remove credentials from URLs.
  fp_notes: Moderate false positive rate. Some examples use placeholder credentials.
- id: TWILIO_ACCOUNT_SID
  name: Twilio Account SID
  category: Twilio
  pattern: AC[a-z0-9]{32}
  severity: MEDIUM
  confidence: 0.8
  description: Potential Twilio Account SID found.
  remediation: Verify context. Use server-side Twilio integration.
  fp_notes: 34-character hex strings appear in other contexts.
- id: DISCORD_TOKEN
  name: Discord Bot Token
  category: Discord
  pattern: '[MN][A-Za-z0-9]{23}\.[\w-]{6}\.[\w-]{27}'
  severity: HIGH
  confidence: 0.82
  description: Potential Discord bot token found.
  remediation: Regenerate token in Discord developer portal.
  fp_notes: Pattern can match other base64-like strings. Confirm with context.
- id: MAPBOX_TOKEN
  name: Mapbox Access Token
  category: Maps
  pattern: pk\.eyJ1[A-Za-z0-9\-_.]+
  severity: LOW
  confidence: 0.9
  description: Mapbox public access token found. Often intentionally embedded.
  remediation: Restrict the token to specific URLs in Mapbox console.
  fp_notes: Mapbox tokens are frequently intentionally public.
