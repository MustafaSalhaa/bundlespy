name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          PYTHONPATH=src pytest tests/unit/ -v --tb=short

      - name: Run demo mode (offline smoke test)
        run: |
          PYTHONPATH=src python3 -m bundlespy.cli demo

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install pyflakes
      - name: Check for obvious errors
        run: |
          python -m pyflakes src/bundlespy/ || true

  safety:
    name: Safety - confirm no private IP requests possible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Verify private IP blocking
        run: |
          PYTHONPATH=src python3 -c "
          from bundlespy.safety.network import validate_url, is_ip_blocked
          blocked = [
              'http://127.0.0.1/',
              'http://192.168.1.1/',
              'http://10.0.0.1/',
              'http://169.254.169.254/',
              'http://localhost/',
              'file:///etc/passwd',
              'ftp://example.com',
          ]
          for url in blocked:
              safe, reason = validate_url(url)
              assert not safe, f'SAFETY FAILURE: {url} was not blocked!'
              print(f'OK blocked: {url}')
          allowed = [
              'https://example.com',
              'http://example.com/api',
          ]
          for url in allowed:
              safe, reason = validate_url(url)
              assert safe, f'SAFETY FAILURE: {url} was incorrectly blocked!'
              print(f'OK allowed: {url}')
          print('All safety checks passed.')
          "
