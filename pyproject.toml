[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bundlespy"
version = "1.0.0"
description = "JavaScript Intelligence and Secret Exposure Scanner for authorized security assessments"
authors = [{name = "Mustafa Salha"}]
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "urllib3>=1.26.0",
    "pyyaml>=6.0",
]

[project.scripts]
bundlespy = "bundlespy.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]
